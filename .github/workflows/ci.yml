name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile scripts
        run: |
          python -m py_compile scripts/llm_migration_benchmark.py
          python -m py_compile scripts/run_benchmark.py
          python -m py_compile scripts/llm_bench_tui.py
          python -m py_compile scripts/bench_web_server.py

      - name: Benchmark CLI smoke test
        run: |
          python scripts/run_benchmark.py --help > /dev/null
          python scripts/run_benchmark.py --config config/benchmark.toml --validate-config
