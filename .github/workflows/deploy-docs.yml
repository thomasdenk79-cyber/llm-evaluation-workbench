name: Docs deployen (MkDocs → GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'

  # Manuell ausloesbar (Actions-Tab → "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MkDocs Material installieren
        run: pip install mkdocs-material

      - name: Docs bauen und deployen
        run: mkdocs gh-deploy --force
        # Baut nach site/ und pusht auf Branch gh-pages
        # GitHub Pages zeigt diesen Branch an
